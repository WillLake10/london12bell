<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="London 12 Bell Competition" />
  <title>London 12 Bell Striking Competition</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  <header class="site-header" id="site-header"></header>
  <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu ☰</button>
  <nav class="site-nav" id="site-nav"></nav>

  <main class="page-body" id="home-content"></main>

  <!-- Shown instead of the above once data/home.json's "mode" is
       "results" - see js/home.js. Same markup/ids as results.html so
       results.js's rendering can be reused as-is. -->
  <main class="page-body" id="home-results" hidden>
    <div id="results-intro"></div>
    <div id="results-table"></div>
    <div id="results-outro"></div>
  </main>

  <div class="modal-backdrop" id="band-modal" hidden>
    <div class="modal-content">
      <button type="button" class="modal-close" aria-label="Close">&times;</button>
      <div id="band-modal-content"></div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/content.js"></script>
  <script src="js/results.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
